<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>63A Mona-Lisa-Steiner-Weg</title>
<style>
  body{background:#fff;color:#000;font-family:Helvetica,Arial,sans-serif;padding:14px 18px}
  #msg{font-size:28px;font-weight:bold;margin-top:40px}
</style>
<script src="core.js"></script>
</head>
<body>
<div id="app"><div id="msg">Lade Daten …</div></div>
<script>
/* Reines ES5 – läuft im Kindle Experimental Browser (alter WebKit). */
(function () {
  "use strict";

  /* ======= HIER die URL des Cloudflare-Workers eintragen ======= */
  var RELAY_URL = "https://kindle-relay.anna-ratz-fotografie.workers.dev/";
  /* Überschreibbar per ?relay=... (z. B. zum Testen gegen den lokalen Server: ?relay=/api/raw) */

  var WEATHER_URL = "https://api.open-meteo.com/v1/forecast?latitude=48.1595&longitude=16.2957" +
    "&current=temperature_2m,apparent_temperature,weathercode,windspeed_10m,winddirection_10m" +
    "&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FVienna&forecast_days=1";
  var TIMEOUT_MS = 15000;
  var STORE_KEY = "kindleDash.raw";

  var app = document.getElementById("app");

  function show(text) {
    app.innerHTML = '<div id="msg">' + text + "</div>";
  }

  if (!window.Dash) {
    show("core.js konnte nicht geladen werden.");
    return;
  }

  // CSS aus core.js übernehmen
  var st = document.createElement("style");
  st.type = "text/css";
  st.appendChild(document.createTextNode(Dash.CSS));
  document.getElementsByTagName("head")[0].appendChild(st);

  // Auf den Bildschirm hochskalieren: Layout ist für 758x1024 gebaut, der Paperwhite-Browser ist größer.
  function fit() {
    var de = document.documentElement;
    var w = window.innerWidth || de.clientWidth;
    var h = window.innerHeight || de.clientHeight;
    var s = Math.min(w / Dash.CFG.designW, h / Dash.CFG.designH);
    document.body.style.zoom = s > 1.02 ? String(Math.floor(s * 100) / 100) : "";
  }
  fit();
  window.onresize = fit;

  function param(name) {
    var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
  }
  var relay = param("relay") || RELAY_URL;

  function getJson(url, cb) {
    var done = false;
    var xhr = new XMLHttpRequest();
    var timer = setTimeout(function () {
      if (done) { return; }
      done = true;
      try { xhr.abort(); } catch (e) {}
      cb("Timeout", null);
    }, TIMEOUT_MS);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4 || done) { return; }
      done = true;
      clearTimeout(timer);
      if (xhr.status < 200 || xhr.status >= 300) {
        cb(xhr.status ? "HTTP " + xhr.status : "Netzwerk/CORS", null);
        return;
      }
      var json = null;
      try { json = JSON.parse(xhr.responseText); } catch (e) { cb("JSON-Fehler", null); return; }
      cb(null, json);
    };
    try {
      xhr.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "_=" + new Date().getTime(), true);
      xhr.send(null);
    } catch (e) {
      done = true;
      clearTimeout(timer);
      cb("XHR: " + e.message, null);
    }
  }

  function getJsonRetry(url, cb) {
    getJson(url, function (err, json) {
      if (!err) { cb(null, json); return; }
      setTimeout(function () { getJson(url, cb); }, 2000);
    });
  }

  function loadStored() {
    try {
      var s = window.localStorage && localStorage.getItem(STORE_KEY);
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  }
  function store(raw) {
    try { if (window.localStorage) { localStorage.setItem(STORE_KEY, JSON.stringify(raw)); } } catch (e) {}
  }

  function render(raw) {
    try {
      app.innerHTML = Dash.renderBody(Dash.buildModel(raw, new Date().getTime()));
    } catch (e) {
      show("Anzeigefehler: " + e.message);
    }
  }

  var last = loadStored();
  if (last) { render(last); }   // sofort etwas zeigen (ggf. veraltet)

  /*
   * Kein Neuladen der ganzen Seite alle 30 s: Ein einziger WLAN-Aussetzer beim Neuladen
   * würde sonst "Webseite nicht erreichbar" zeigen und das Dashboard wäre weg.
   * Die Seite bleibt stehen, nur die Daten werden per XHR geholt; Fehler -> letzter Stand.
   */
  var busy = false;
  function refresh() {
    if (busy) { return; }
    busy = true;
    getJsonRetry(relay, function (err, raw) {
      if (!err && raw && (raw.wl || raw.weather)) {
        busy = false;
        last = raw;
        store(raw);
        render(raw);
        return;
      }
      // Relay nicht erreichbar: Wetter direkt (Open-Meteo erlaubt CORS), WL aus letztem Stand
      var fallback = {
        wl: last ? last.wl : null,
        wlAt: last ? last.wlAt : null,
        wlError: "Relay: " + (err || "leere Antwort"),
        weather: null, weatherAt: null, weatherError: ""
      };
      getJson(WEATHER_URL, function (werr, w) {
        busy = false;
        if (!werr) {
          fallback.weather = w;
          fallback.weatherAt = new Date().getTime();
        } else {
          fallback.weather = last ? last.weather : null;
          fallback.weatherAt = last ? last.weatherAt : null;
          fallback.weatherError = werr;
        }
        render(fallback);
      });
    });
  }

  refresh();
  setInterval(refresh, 30000);

  // Alle 6 h die Seite neu laden (Code-Updates, Speicher) – aber nur, wenn sie gerade erreichbar ist.
  function reachable(url, cb) {
    var done = false;
    var xhr = new XMLHttpRequest();
    var timer = setTimeout(function () {
      if (done) { return; }
      done = true;
      try { xhr.abort(); } catch (e) {}
      cb(false);
    }, TIMEOUT_MS);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4 || done) { return; }
      done = true;
      clearTimeout(timer);
      cb(xhr.status === 200 && xhr.responseText.indexOf("core.js") > -1);
    };
    try {
      xhr.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "_=" + new Date().getTime(), true);
      xhr.send(null);
    } catch (e) { done = true; clearTimeout(timer); cb(false); }
  }

  setInterval(function () {
    reachable(location.href.split("#")[0], function (ok) {
      if (ok) { location.reload(); }
    });
  }, 6 * 60 * 60 * 1000);
}());
</script>
</body>
</html>
